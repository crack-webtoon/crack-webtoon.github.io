<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>작품 일정표</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--line:#e4e3de;--line2:#cfcdc6;--tx:#1f1f1d;--tx2:#6b6a65;--tx3:#9b9a94;--acc:#2f6fd6;--accbg:#e8f0fc;--red:#c43c3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px}
button{font:inherit;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--tx)}
button:hover{background:#f1f0ec}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{background:#2560bd}
button.del{color:var(--red)}
button.ic{padding:4px 8px}
input,select,textarea{font:inherit;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;background:#fff;color:var(--tx);width:100%}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 4px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:18px;font-weight:600;margin:0 8px 0 0}
.mon{font-size:17px;font-weight:600;min-width:110px;text-align:center}
.sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid transparent;cursor:pointer;user-select:none}
.chip.off{background:#fff!important;color:var(--tx3)!important;border-color:var(--line);text-decoration:line-through}
.chip.all{background:#fff;border-color:var(--line2);color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:104px;padding:4px;min-width:0}
.cal .hd{min-height:auto;text-align:center;font-size:12px;color:var(--tx2);background:#fafaf8;padding:6px 0}
.cal .hd.sun,.dn.sun{color:var(--red)}.cal .hd.sat,.dn.sat{color:var(--acc)}
.cell{cursor:pointer}.cell:hover{background:#fbfbf9}
.cell.out{background:#fafaf8}.cell.out .dn{opacity:.4}
.dn{font-size:12px;color:var(--tx2);margin-bottom:2px;display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%}
.today .dn{background:var(--acc);color:#fff!important}
.ev{display:block;font-size:11.5px;line-height:1.35;border-radius:4px;padding:2px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.serial{color:#fff}
.ev.old{opacity:.45;text-decoration:line-through}
.ev.hiatus{background:#f0efeb!important;color:var(--tx2)!important;border-left:3px solid}
.ev[draggable="true"]{cursor:grab}.ev.dragging{opacity:.4}.cell.dropok{background:var(--accbg)!important;outline:2px dashed var(--acc);outline-offset:-2px}
label.opt{display:block;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:8px 0 0;font-size:13px;color:var(--tx);cursor:pointer}
label.opt .muted{margin:3px 0 0 22px}
label.opt input{width:auto;margin:0 6px 0 0;vertical-align:-2px}
.more{font-size:11.5px;color:var(--tx2);padding:2px 5px;cursor:pointer}
.more:hover{text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.md{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:460px}
.md.wide{max-width:640px}
.md h2{font-size:16px;margin:0 0 4px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.acts .sp{flex:1}
.wdays{display:flex;gap:4px}
.wdays label{margin:0;flex:1;text-align:center;border:1px solid var(--line2);border-radius:8px;padding:6px 0;cursor:pointer;font-size:13px;color:var(--tx)}
.wdays input{display:none}
.wdays label.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw span{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw span.on{border-color:var(--tx)}
.wl{border-top:1px solid var(--line);margin-top:10px}
.wl>div{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.muted{color:var(--tx2);font-size:12px}
.hint{color:var(--tx3);font-size:12px;margin-top:6px}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}
.cm .meta{font-size:12px;color:var(--tx2);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.cm .tx{white-space:pre-wrap;word-break:break-all}
.cm.new{background:#fffbea}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-top:12px}
.up>div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.up .d{color:var(--tx2);min-width:76px}
.login{max-width:360px;margin:16vh auto;text-align:center}
.demo{background:#fff4d6;border:1px solid #f0d58a;color:#6b4e00;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.pdgrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:start}
.pmain{min-width:0}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:12px}
.side summary{display:none}
.side input{font-size:13px;padding:6px 9px;margin-bottom:6px}
.wi{border-radius:8px}
.wi.open{background:#f4f6fb}
.wrow{display:flex;align-items:center;gap:7px;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.wrow:hover{background:#f6f6f3}
.wrow .nm{flex:1;min-width:0}
.wrow .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .sub{font-size:11px;color:var(--tx2)}
.wrow.off .nm{color:var(--tx3)}
.ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer}
.ck.y{background:var(--acc);border-color:var(--acc)}
.wdet{padding:2px 8px 10px 29px;font-size:12px;color:var(--tx2)}
.wdet .bt{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.wdet button{font-size:12px;padding:4px 8px}
.agenda{display:none}
.agenda .ad{font-size:12px;color:var(--tx2);margin:12px 0 4px;font-weight:600}
.agenda .ev{white-space:normal;font-size:13px;padding:5px 8px;margin-top:3px}
.ev .wn{font-weight:400}
.ev .ls{display:none}
.stitle{display:none}
@media(min-width:761px){
 .wrap.wide{max-width:none;padding:12px 16px}
 .wrap.wide .pdgrid{grid-template-columns:300px minmax(0,1fr);gap:16px}
 .wrap.wide .side{top:12px}
 .wrap.wide .sbody{height:calc(100vh - 46px);display:flex;flex-direction:column}
 .wrap.wide .stitle{display:block;font-size:18px;font-weight:600;margin:2px 2px 10px}
 .wrap.wide .slist{flex:1;overflow:auto;min-height:0}
 .wrap.wide .top h1{display:none}
 .wrap.wide .top{margin-bottom:10px}
 .card.fill{height:calc((100vh - 82px) * .7);min-height:400px;display:flex;flex-direction:column}
 .card.fill .cal{flex:1;min-height:0}
 .card.fill .cal>div{min-height:0;overflow:hidden}
}
@media(max-width:760px){
 .wrap{padding:10px}
 .pdgrid{display:flex;flex-direction:column;align-items:stretch}
 .pmain{display:contents}
 .pmain .top{order:1}
 .side{order:2}
 .card.fill{order:3}
 .agenda{order:4}
 .top{gap:6px}
 .top h1{width:100%;font-size:17px}
 .top .sp{display:none}
 .mon{min-width:auto;font-size:15px}
 .pdgrid{grid-template-columns:1fr}
 .side{position:static;padding:8px 10px}
 .side summary{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;list-style:none;padding:2px 0}
 .side summary::-webkit-details-marker{display:none}
 .card{padding:6px}
 .cal>div{min-height:58px;padding:2px}
 .cal .hd{font-size:11px;padding:4px 0}
 .dn{font-size:11px;min-width:18px;height:18px;line-height:18px}
 .ev,.more{font-size:10px;padding:1px 2px;margin-top:1px;border-radius:3px}
 .ev.hiatus{border-left-width:2px}
 .ev .wn{display:none}
 .cal .ev .lf{display:none}
 .cal .ev .ls{display:inline}
 .grid2{grid-template-columns:1fr}
 .agenda{display:block}
 .ov{padding:8px}
 .md{padding:16px;border-radius:12px}
 .row{flex-wrap:wrap}
 .row>*{min-width:120px}
 .hint.pc{display:none}
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* ===== 설정: 기존 PD 매니저와 같은 Firebase 설정값을 붙여넣으세요 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCqUwH_Kc0kwYU3Fl95LyFx1eyXbjkIGLY",
  authDomain: "webtoon-pd-3edda.firebaseapp.com",
  projectId: "webtoon-pd-3edda",
  storageBucket: "webtoon-pd-3edda.firebasestorage.app",
  messagingSenderId: "173903637531",
  appId: "1:173903637531:web:5687f6fbaa800537e7dcbe"
};
/* PD 구글 계정 이메일 (보안 규칙의 이메일과 같아야 합니다) */
const PD_DOMAIN = "@crackent.com";
const isPDEmail = e => !!e && e.toLowerCase().endsWith(PD_DOMAIN);
/* ===================================================================== */

const DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("여기에");
const TYPES = {
  conti:  {label:"콘티 마감"},
  manu:   {label:"원고 마감"},
  hiatus: {label:"휴재"},
  launch: {label:"런칭"},
  cover_draft: {label:"표지 시안"},
  cover: {label:"표지 마감"},
  etc:    {label:"기타"}
};
const TYPE_ORDER = {serial:0, launch:1, manu:2, conti:3, cover_draft:4, cover:5, hiatus:6, etc:7};
const HUES = [250,160,15,330,200,45,280,120,0,185,300,75,225,140,30,350,265,100,210,55];
const col = i => { const h = HUES[(i||0) % HUES.length]; return {bg:`hsl(${h} 70% 92%)`, fg:`hsl(${h} 55% 26%)`, solid:`hsl(${h} 48% 44%)`}; };
const WD = ["일","월","화","수","목","금","토"];
const pad = n => String(n).padStart(2,"0");
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pdate = s => { const [a,b,c] = s.split("-").map(Number); return new Date(a,b-1,c); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = (n=24) => { const a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"; const r=crypto.getRandomValues(new Uint8Array(n)); return [...r].map(x=>a[x%a.length]).join(""); };
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const clone = o => JSON.parse(JSON.stringify(o));
const toDate = at => at && at.toDate ? at.toDate() : (at ? new Date(at) : null);
const fmtTime = at => { const d = toDate(at); return d ? `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : "방금"; };
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }
const shareLink = t => location.origin + location.pathname + "?w=" + t;

/* ===== 저장소 ===== */
function fbStore(){
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore(), C = db.collection("cal_share");
  return {
    auth: firebase.auth(),
    watchWorks(cb, err, owner){ return C.where("owner", "==", owner).onSnapshot(s => cb(s.docs.map(d => ({...d.data(), token:d.id}))), err); },
    saveWork(w){ const {token, ...data} = w; return C.doc(token).set(data); },
    mutate(t, fn){ const ref = C.doc(t); return db.runTransaction(async tx => { const s = await tx.get(ref); if (!s.exists) throw new Error("작품을 찾을 수 없습니다"); tx.update(ref, {events: fn(clone(s.data().events || []))}); }); },
    update(t, fields){ return C.doc(t).update(fields); },
    pdWorks(uid){ return db.collection("users").doc(uid).collection("data").doc("main").get().then(d => d.exists ? (d.data().works || []).map(w => ({id: w.id, title: w.title})) : []).catch(() => []); },
    async deleteWork(t){ const s = await C.doc(t).collection("comments").get(); await Promise.all(s.docs.map(d=>d.ref.delete())); return C.doc(t).delete(); },
    watchShare(t, cb, err){ return C.doc(t).onSnapshot(d => cb(d.exists ? {...d.data(), token:d.id} : null), err); },
    watchComments(t, cb){ return C.doc(t).collection("comments").orderBy("at","desc").limit(50).onSnapshot(s => cb(s.docs.map(d => ({id:d.id, ...d.data()}))), () => cb([])); },
    addComment(t, c){ return C.doc(t).collection("comments").add({...c, at: firebase.firestore.FieldValue.serverTimestamp()}); },
    deleteComment(t, id){ return C.doc(t).collection("comments").doc(id).delete(); },
    markSeen(t, id){ return C.doc(t).collection("comments").doc(id).update({seen:true}); }
  };
}
function demoStore(){
  const W = {}, CM = {}, wl = [], sl = {}, cl = {};
  const today = new Date(), y = today.getFullYear(), m = today.getMonth();
  const d = (dd, mm=m) => ds(new Date(y, mm, dd));
  const seed = [
    {name:"작품A", serial:{start:d(6), days:[2], ep:1, end:""}, events:[{id:rid(8),date:d(3),type:"conti",title:"1~3화"},{id:rid(8),date:d(10),type:"manu",title:"4화"},{id:rid(8),date:d(27),type:"hiatus",title:"정기 휴재",end:""}]},
    {name:"작품B", serial:{start:d(1,m-2), days:[1,4], ep:1, end:""}, events:[{id:rid(8),date:d(8),type:"manu",title:"22화"},{id:rid(8),date:d(15),type:"conti",title:"24~25화"}]},
    {name:"작품C", serial:null, events:[{id:rid(8),date:d(13),type:"manu",title:"1~5화 비축"},{id:rid(8),date:d(20),type:"launch",title:"런칭"}]},
    {name:"작품D", serial:{start:d(1,m-5), days:[6], ep:1, end:""}, events:[{id:rid(8),date:d(17),type:"hiatus",title:"시즌 휴재",end:d(31)}]}
  ];
  seed.forEach((s,i) => { const t = rid(); W[t] = {...s, token:t, color:i, createdAt:i}; CM[t] = []; });
  const first = Object.keys(W)[0];
  CM[first].push({id:rid(8), name:"작가A", text:"10일 원고 마감 확인했습니다.", at:Date.now()-3600e3, seen:false});
  const list = () => Object.values(W).map(clone);
  const emitW = () => wl.forEach(f => f(list()));
  const emitS = t => (sl[t]||[]).forEach(f => f(W[t] ? clone(W[t]) : null));
  const emitC = t => (cl[t]||[]).forEach(f => f(clone(CM[t]||[])));
  return {
    auth: null,
    watchWorks(cb){ wl.push(cb); cb(list()); return ()=>{}; },
    async saveWork(w){ W[w.token] = clone(w); CM[w.token] = CM[w.token] || []; emitW(); emitS(w.token); },
    async mutate(t, fn){ W[t].events = fn(clone(W[t].events || [])); emitW(); emitS(t); },
    async update(t, f){ Object.assign(W[t], clone(f)); emitW(); emitS(t); },
    async pdWorks(){ return [{id:"demo1", title:"그 공작가의 막내딸은 사실 악녀였다"}, {id:"demo2", title:"질 나쁜 선배"}]; },
    async deleteWork(t){ delete W[t]; delete CM[t]; emitW(); emitS(t); },
    watchShare(t, cb){ (sl[t] = sl[t] || []).push(cb); cb(W[t] ? clone(W[t]) : null); return ()=>{}; },
    watchComments(t, cb){ (cl[t] = cl[t] || []).push(cb); cb(clone(CM[t]||[])); return ()=>{}; },
    async addComment(t, c){ (CM[t] = CM[t] || []).unshift({id:rid(8), ...c, at:Date.now(), seen:false}); emitC(t); },
    async deleteComment(t, id){ CM[t] = (CM[t]||[]).filter(x => x.id !== id); emitC(t); },
    async markSeen(t, id){ const c = (CM[t]||[]).find(x => x.id === id); if (c) c.seen = true; emitC(t); }
  };
}
const store = DEMO ? demoStore() : fbStore();

/* ===== 상태 ===== */
const qs = new URLSearchParams(location.search);
const now = new Date();
const S = {
  mode: qs.get("w") ? "author" : "pd",
  token: qs.get("w"),
  user: null, denied: false,
  works: [], share: null, shareLoaded: false,
  comments: {}, unsubC: {},
  hidden: new Set(ls.get("cal_hidden", [])),
  y: now.getFullYear(), m: now.getMonth()
};

/* ===== 일정 계산 ===== */
function entriesFor(works, from, to){
  const map = {};
  const push = (k, e) => (map[k] = map[k] || []).push(e);
  for (const w of works){
    const evs = w.events || [];
    const hi = new Set();
    for (const e of evs){
      const end = e.end && e.end > e.date ? e.end : e.date;
      for (let d = pdate(e.date); ds(d) <= end; d.setDate(d.getDate()+1)){
        const k = ds(d);
        if (e.type === "hiatus") hi.add(k);
        const cont = k !== e.date;
        const sd = w.serial && w.serial.days ? w.serial.days : [];
        if (cont && e.type === "hiatus" && !sd.includes(d.getDay())) continue;
        if (k >= from && k <= to) push(k, {kind:"ev", w, e, cont});
      }
    }
    const s = w.serial;
    if (s && s.start && s.days && s.days.length){
      let ep = (parseInt(s.ep) || 1) - 1;
      const last = s.end && s.end < to ? s.end : to;
      for (let d = pdate(s.start); ds(d) <= last; d.setDate(d.getDate()+1)){
        if (!s.days.includes(d.getDay())) continue;
        const k = ds(d);
        if (hi.has(k)) continue;
        ep++;
        if (k >= from) push(k, {kind:"serial", w, ep});
      }
    }
  }
  const ord = new Map(works.map((w,i) => [w.token, i]));
  for (const k in map) map[k].sort((a,b) => (TYPE_ORDER[a.kind==="serial"?"serial":a.e.type] - TYPE_ORDER[b.kind==="serial"?"serial":b.e.type]) || (ord.get(a.w.token) - ord.get(b.w.token)));
  return map;
}
const SHORT = {conti:"콘티", manu:"원고", cover_draft:"표지시안", cover:"표지", hiatus:"휴재", launch:"런칭", etc:"기타"};
const workShort = w => (w.short && w.short.trim()) || w.name;
const VER_TYPES = new Set(["manu", "conti"]);
const numTitle = e => { const m = String(e.title || "").trim().match(/^(\d+)\s*화?$/); return m ? m[1] : ""; };
const epOf = e => String(e.episode || numTitle(e) || "");
const titleOf = e => (numTitle(e) && numTitle(e) === epOf(e)) ? "" : (e.title || "");
const epText = e => (epOf(e) ? ` ${epOf(e)}화` : "") + (e.version ? ` (${e.version}차)` : "");
function calcVer(events, ev){
  if (!epOf(ev) || !VER_TYPES.has(ev.type)) return null;
  const n = events.filter(x => x.id !== ev.id && x.type === ev.type && epOf(x) === epOf(ev)).length;
  return n > 0 ? n + 1 : null;
}
const superseded = (w, e) => !!epOf(e) && VER_TYPES.has(e.type) && (w.events || []).some(o => o.id !== e.id && o.type === e.type && epOf(o) === epOf(e) && (o.version || 1) > (e.version || 1));
function entryLabel(x){
  if (x.kind === "serial") return x.ep + "화 연재";
  const t = TYPES[x.e.type] ? TYPES[x.e.type].label : "일정";

function calendarHTML(works, isPD){
  const first = new Date(S.y, S.m, 1);
  const start = new Date(S.y, S.m, 1 - first.getDay());
  const lastDay = new Date(S.y, S.m + 1, 0);
  const end = new Date(lastDay); end.setDate(end.getDate() + (6 - lastDay.getDay()));
  const map = entriesFor(works, ds(start), ds(end));
  const td = ds(new Date());
  const weeks = Math.round((end - start) / 864e5 + 1) / 7;
  const MAX = (isPD && window.innerWidth > 760) ? Math.max(2, Math.floor((((window.innerHeight - 82) * .7 - 38) / weeks - 30) / 20)) : 4;
  let h = `<div class="cal" style="grid-template-rows:auto repeat(${weeks},minmax(0,1fr))">` + WD.map((w,i) => `<div class="hd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const k = ds(d), list = map[k] || [];
    const dw = d.getDay();
    h += `<div class="cell ${d.getMonth()!==S.m?"out":""} ${k===td?"today":""}" data-act="day" data-d="${k}">`
       + `<span class="dn ${dw===0?"sun":dw===6?"sat":""}">${d.getDate()}</span>`

}

async function saveEvent(token, id){
  const t = token || document.getElementById("f-w").value;
  const w = findWork(t); if (!w) return;
  const v = id => document.getElementById(id).value.trim();
  const date = v("f-date"); if (!date) return toast("날짜를 입력해 주세요");
  let end = v("f-end"); if (end && end <= date) end = "";
  const old = id ? (w.events || []).find(x => x.id === id) : null;
  const episode = v("f-ep").replace(/화$/, "").trim();
  const data = {...(old || {}), id: id || rid(10), date, end, type: v("f-type"), title: v("f-title"), memo: v("f-memo"), episode};
  if (!old || old.type !== data.type || String(old.episode || "") !== episode) data.version = calcVer(w.events || [], data);
  if (data.version === undefined) data.version = null;
  if (old && old.date !== date) return moveRequest(t, id, date, data);
  try {
    await store.mutate(t, evs => { const i = evs.findIndex(x => x.id === data.id); if (i >= 0) evs[i] = data; else { if (!old) data.version = calcVer(evs, data); evs.push(data); } return evs; });
    closeModal(); toast("저장했습니다");
  } catch(err){ toast("저장하지 못했습니다: " + err.message); }
}
const addDays = (str, n) => { const d = pdate(str); d.setDate(d.getDate() + n); return ds(d); };
const dayDiff = (a, b) => Math.round((pdate(b) - pdate(a)) / 864e5);
const SKIP_ALL = new Set(["hiatus", "launch"]);
function shiftTargets(w, e, mode){
  const evs = (w.events || []).filter(x => x.id !== e.id && x.date > e.date);
  if (mode === "same") return evs.filter(x => x.type === e.type);
  if (mode === "all") return evs.filter(x => !SKIP_ALL.has(x.type));
  return [];
}
const md = s => s.slice(5).replace("-", "/");
function moveRequest(t, id, newDate, patch){
  const w = findWork(t); if (!w) return;
  const e = (w.events || []).find(x => x.id === id); if (!e) return;
  const delta = dayDiff(e.date, newDate);
  if (!delta && !patch) return;
  const same = shiftTargets(w, e, "same").sort((a,b) => a.date < b.date ? -1 : 1);
  const all = shiftTargets(w, e, "all");
  S.pendingMove = {t, id, newDate, patch, delta};
  if (!same.length && !all.length) return applyMove("only");
  const dir = delta > 0 ? `${delta}일 뒤로` : `${-delta}일 앞으로`;
  const verb = delta > 0 ? "미루기" : "당기기";
  const prev = same.slice(0,2).map(x => `${esc(x.title || TYPES[x.type].label)} ${md(x.date)}→${md(addDays(x.date, delta))}`).join(" · ") + (same.length > 2 ? ` 외 ${same.length - 2}건` : "");
  const lbl = TYPES[e.type] ? TYPES[e.type].label : "일정";
  openModal(`<h2>${esc(lbl)}${e.title ? " " + esc(e.title) : ""} · ${md(e.date)} → ${md(newDate)} (${dir})</h2>
    <p class="muted">${esc(w.name)} · 이후 일정도 같이 옮길까요?</p>
    <label class="opt"><input type="radio" name="mv" value="only"> 이 일정만 옮기기</label>
    ${same.length ? `<label class="opt"><input type="radio" name="mv" value="same" checked> 이후 <b>${esc(lbl)}</b> ${same.length}건도 모두 ${Math.abs(delta)}일씩 ${verb}<div class="muted">${prev}</div></label>` : ""}
    ${all.length ? `<label class="opt"><input type="radio" name="mv" value="all" ${same.length ? "" : "checked"}> 이후 <b>모든 일정</b> ${all.length}건 ${Math.abs(delta)}일씩 ${verb}<div class="muted">휴재·런칭은 제외</div></label>` : ""}
    <div class="acts"><button data-act="close">취소</button><button class="pri" data-act="mv-apply">옮기기</button></div>`);
}
async function applyMove(mode){
  const m = S.pendingMove; if (!m) return;
  S.pendingMove = null;
  const shift = x => { x.date = addDays(x.date, m.delta); if (x.end) x.end = addDays(x.end, m.delta); };
  let targets = new Set();
  try {
    await store.mutate(m.t, evs => {
      const e = evs.find(x => x.id === m.id); if (!e) return evs;
      targets = new Set(shiftTargets({events: evs}, e, mode).map(x => x.id));
      return evs.map(x => {
        if (x.id === m.id){ const y = m.patch ? {...x, ...m.patch} : {...x}; if (!m.patch) shift(y); return y; }
        if (targets.has(x.id)){ const y = {...x}; shift(y); return y; }
        return x;
      });
    });
    closeModal(); toast(targets.size ? `${targets.size + 1}건을 옮겼습니다` : "옮겼습니다"); } catch(err){ toast("저장하지 못했습니다: " + err.message); }
}

    <label>연재 요일</label><div class="wdays">${WD.map((d,i) => `<label class="${days.has(i)?"on":""}"><input type="checkbox" value="${i}" ${days.has(i)?"checked":""}>${d}</label>`).join("")}</div>
    <label>연재 종료일 (완결 시)</label><input type="date" id="f-send" value="${s.end||""}">
    <p class="hint">연재 시작 전이면 비워 두세요. 시작일을 넣으면 해당 요일마다 회차가 자동으로 표시됩니다.</p></div>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:4px"><label style="font-size:13px;color:var(--tx);font-weight:600">PD 매니저 마감 달력 연결</label>
    <select id="f-pd"><option value="">불러오는 중…</option></select>
    <p class="hint">연결하면 원고·콘티·표지 시안·표지 마감·런칭·휴재 일정이 PD 매니저 마감 달력과 함께 관리됩니다. 어느 쪽에서 고쳐도 양쪽에 반영됩니다.</p></div>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:4px"><label style="font-size:13px;color:var(--tx);font-weight:600">작가님 링크</label>
    <div class="row"><input readonly value="${shareLink(t)}" onclick="this.select()"><button style="flex:none" data-act="copy" data-t="${t}">복사</button></div>
    <div class="row" style="margin-top:8px"><button data-act="preview" data-t="${t}">작가 화면 보기</button><button data-act="regen" data-t="${t}">링크 새로 발급</button></div>
    <p class="hint">링크가 다른 분께 전달된 것 같으면 새로 발급해 주세요. 이전 링크는 바로 막힙니다(이전 코멘트는 삭제됩니다).</p></div>
    <div class="acts"><button class="del" data-act="work-del" data-t="${t}">작품 삭제</button><span class="sp"></span><button data-act="works">목록</button><button class="pri" data-act="work-save" data-t="${t}">저장</button></div>`);
  store.pdWorks(S.user && S.user.uid).then(list => {
    const sel = document.getElementById("f-pd"); if (!sel) return;
    const used = new Map(S.works.filter(x => x.pdWorkId && x.token !== t).map(x => [x.pdWorkId, x.name]));
    sel.innerHTML = `<option value="">연결 안 함</option>` + list.map(p => `<option value="${esc(p.id)}" ${w.pdWorkId === p.id ? "selected" : ""} ${used.has(p.id) ? "disabled" : ""}>${esc(p.title)}${used.has(p.id) ? " (" + esc(used.get(p.id)) + "에 연결됨)" : ""}</option>`).join("");
    if (!list.length) sel.innerHTML = `<option value="">PD 매니저 작품을 불러오지 못했습니다</option>`; else sel.dataset.loaded = "1";
  });
}
async function saveWorkSettings(t){
  const w = clone(findWork(t));
  const v = id => document.getElementById(id).value.trim();
  const name = v("f-name"); if (!name) return toast("작품명을 입력해 주세요");
  w.name = name;
  w.short = v("f-short");
  w.color = +document.getElementById("f-color").dataset.v;
  const days = [...document.querySelectorAll(".wdays input:checked")].map(x => +x.value);
  const start = v("f-sstart");
  if (start && !days.length) return toast("연재 요일을 선택해 주세요");
  w.serial = start ? {start, days, ep: Math.max(1, parseInt(v("f-sep")) || 1), end: v("f-send")} : null;
  const pdSel = document.getElementById("f-pd");
  const pdWorkId = pdSel && pdSel.dataset.loaded ? pdSel.value : (w.pdWorkId || "");
  try { await store.update(t, {name: w.name, short: w.short, color: w.color, serial: w.serial, pdWorkId}); toast("저장했습니다"); worksModal(); }
  catch(err){ toast("저장하지 못했습니다: " + err.message); }
}
async function regenLink(t){
  if (!confirm("새 링크를 발급할까요? 기존 링크는 더 이상 열리지 않습니다.")) return;
  const w = clone(findWork(t)); const nt = rid();
  w.token = nt; await store.saveWork(w); await store.deleteWork(t);
  toast("새 링크를 발급했습니다"); setTimeout(() => workEditModal(nt), 100);
}
async function deleteWork(t){
  const w = findWork(t);
  if (!confirm(`'${w.name}' 작품과 모든 일정을 삭제할까요? 되돌릴 수 없습니다.`)) return;
  await store.deleteWork(t); toast("삭제했습니다"); worksModal();
}
function commentsModal(){
  const all = [];
  for (const w of sortedWorks()) for (const c of (S.comments[w.token]||[])) all.push({w, c});
  all.sort((a,b) => (toDate(b.c.at)||new Date()) - (toDate(a.c.at)||new Date()));
  openModal(`<h2>작가님 코멘트</h2>
    <div>${all.map(({w,c}) => `<div class="cm ${c.seen?"":"new"}"><div class="meta"><span class="dot" style="background:${col(w.color).solid}"></span><b>${esc(w.name)}</b> · ${esc(c.name||"작가")} · ${fmtTime(c.at)}<span class="sp"></span><button class="ic del" data-act="cm-del" data-t="${w.token}" data-id="${c.id}">삭제</button></div><div class="tx">${esc(c.text)}</div></div>`).join("") || `<p class="muted">받은 코멘트가 없습니다.</p>`}</div>
    <div class="acts"><button data-act="close">닫기</button></div>`, true);
  all.filter(x => !x.c.seen).forEach(x => store.markSeen(x.w.token, x.c.id).catch(()=>{}));
}
function syncCommentListeners(){
  const ts = new Set(S.works.map(w => w.token));
  for (const t of ts) if (!S.unsubC[t]) S.unsubC[t] = store.watchComments(t, list => { S.comments[t] = list; if (S.mode === "pd") renderPD(); });
  for (const t in S.unsubC) if (!ts.has(t)){ try{ S.unsubC[t](); }catch(e){} delete S.unsubC[t]; delete S.comments[t]; }
}

/* ===== 작가 화면 ===== */
function buildAuthor(){
  document.getElementById("main").innerHTML = `<div class="wrap">
    <div class="top"><h1 id="a-title">일정표</h1>${`<span id="a-nav" style="display:flex;align-items:center;gap:8px"></span>`}</div>
    <div id="a-body"></div>
    <div class="grid2" id="a-side" style="display:none">
      <div class="card"><b style="font-size:14px">다가오는 일정</b><div class="up" id="a-up"></div></div>
      <div class="card"><b style="font-size:14px">PD에게 남기기</b>
        <input id="a-name" placeholder="성함" maxlength="30" style="margin-top:10px" value="${esc(ls.get("cal_author_name",""))}">
        <textarea id="a-text" placeholder="10일 마감 확인했습니다 / 15일 마감을 17일로 미뤄도 될까요?" maxlength="500" style="margin-top:6px"></textarea>
        <div id="a-err" style="color:var(--red);font-size:12px"></div>
        <div style="text-align:right;margin-top:6px"><button class="pri" data-act="a-send">남기기</button></div>
        <div id="a-cm"></div></div>
    </div></div>`;
}
function renderAuthor(){
  const w = S.share;
  if (!S.shareLoaded) { document.getElementById("a-body").innerHTML = `<p class="muted">불러오는 중…</p>`; return; }
  if (!w){
    document.getElementById("a-title").textContent = "일정표";
    document.getElementById("a-nav").innerHTML = "";
    document.getElementById("a-side").style.display = "none";
    document.getElementById("a-body").innerHTML = `<div class="card" style="padding:40px;text-align:center"><p>열 수 없는 링크입니다.</p><p class="muted">링크가 바뀌었을 수 있습니다. 담당 PD에게 새 링크를 요청해 주세요.</p></div>`;
    return;
  }
  document.title = w.name + " 일정표";
  document.getElementById("a-title").innerHTML = `<span class="dot" style="display:inline-block;background:${col(w.color).solid};margin-right:6px"></span>${esc(w.name)} 일정표`;
  document.getElementById("a-nav").innerHTML = monthNav();
  document.getElementById("a-side").style.display = "";
  document.getElementById("a-body").innerHTML = (DEMO?`<div class="demo">작가 화면 미리보기입니다. <a href="#" data-act="back-pd">PD 화면으로 돌아가기</a></div>`:"")
    + `<div class="card">${calendarHTML([w], false)}</div><p class="hint">${esc(serialText(w.serial))}</p>`;
  const from = new Date(); const to = new Date(); to.setDate(to.getDate() + 45);
  const map = entriesFor([w], ds(from), ds(to));
  const rows = Object.keys(map).sort().flatMap(k => map[k].filter(x => !x.cont).map(x => ({k, x})));
  document.getElementById("a-up").innerHTML = rows.slice(0, 15).map(({k,x}) => { const d = pdate(k); return `<div><span class="d">${d.getMonth()+1}/${d.getDate()} (${WD[d.getDay()]})</span><span>${esc(entryLabel(x))}${x.kind==="ev"&&x.e.end?` ~ ${x.e.end.slice(5).replace("-","/")}`:""}${x.kind==="ev"&&x.e.memo?`<div class="muted">${esc(x.e.memo)}</div>`:""}</span></div>`; }).join("") || `<p class="muted">45일 안에 예정된 일정이 없습니다.</p>`;
  const cms = S.comments[w.token] || [];
  document.getElementById("a-cm").innerHTML = cms.length ? `<div style="margin-top:10px;border-top:1px solid var(--line)">${cms.map(c => `<div class="cm"><div class="meta">${esc(c.name||"")} · ${fmtTime(c.at)}</div><div class="tx">${esc(c.text)}</div></div>`).join("")}</div>` : "";
}
async function authorSend(){
  const name = document.getElementById("a-name").value.trim();
  const text = document.getElementById("a-text").value.trim();
  const err = document.getElementById("a-err");
  if (!name) { err.textContent = "성함을 입력해 주세요"; return; }
  if (!text) { err.textContent = "내용을 입력해 주세요"; return; }
  err.textContent = "";
  ls.set("cal_author_name", name);
  try { await store.addComment(S.token, {name, text}); document.getElementById("a-text").value = ""; toast("PD에게 전달했습니다"); }
  catch(e){ err.textContent = "전송하지 못했습니다. 잠시 후 다시 시도해 주세요."; }
}
function startAuthor(){
  buildAuthor(); renderAuthor();
  store.watchShare(S.token, w => { S.share = w; S.shareLoaded = true; renderAuthor(); }, () => { S.share = null; S.shareLoaded = true; renderAuthor(); });
  store.watchComments(S.token, list => { S.comments[S.token] = list; renderAuthor(); });
}

/* ===== 이벤트 ===== */
const render = () => S.mode === "pd" ? renderPD() : renderAuthor();
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, t = el.dataset.t, id = el.dataset.id, d = el.dataset.d;
  if (a === "close-ov"){ if (ev.target === el) closeModal(); return; }
  ev.stopPropagation();
  if (["ev","serial","more"].includes(a) && S.mode === "author") return;
  switch(a){
    case "prev": S.m--; if (S.m < 0){ S.m = 11; S.y--; } render(); break;
    case "next": S.m++; if (S.m > 11){ S.m = 0; S.y++; } render(); break;
    case "today": S.y = now.getFullYear(); S.m = now.getMonth(); render(); break;
    case "login": try { await store.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch(e){ toast("로그인하지 못했습니다"); } break;
    case "add": eventModal(); break;
    case "add-on": eventModal(d); break;
    case "day": if (S.mode === "pd") { if (window.innerWidth <= 760) dayModal(d); else eventModal(d); } break;
    case "wopen": S.open = S.open === t ? null : t; document.getElementById("side-list").innerHTML = sideListHTML(); break;
    case "only": S.hidden = new Set(S.works.filter(w => w.token !== t).map(w => w.token)); ls.set("cal_hidden", [...S.hidden]); renderPD(); break;
    case "more": dayModal(d); break;
    case "ev": eventModal(null, t, id); break;
    case "serial": workEditModal(t); break;
    case "ev-save": saveEvent(t, id); break;
    case "ev-del": deleteEvent(t, id); break;
    case "close": closeModal(); break;
    case "works": worksModal(); break;
    case "work-add": addWork(); break;
    case "work-edit": workEditModal(t); break;
    case "work-save": saveWorkSettings(t); break;
    case "work-del": deleteWork(t); break;
    case "regen": regenLink(t); break;
    case "pick": { const p = document.getElementById("f-color"); p.dataset.v = el.dataset.i; p.querySelectorAll("span").forEach(s => s.classList.toggle("on", s === el)); break; }
    case "copy": try { await navigator.clipboard.writeText(shareLink(t)); toast("링크를 복사했습니다"); } catch(e){ prompt("링크를 복사해 주세요", shareLink(t)); } break;
    case "preview":
      if (DEMO){ closeModal(); S.mode = "author"; S.token = t; S.share = null; S.shareLoaded = false; startAuthor(); }
      else window.open(shareLink(t), "_blank");
      break;
    case "back-pd": ev.preventDefault(); S.mode = "pd"; renderPD(); break;
    case "chip": S.hidden.has(t) ? S.hidden.delete(t) : S.hidden.add(t); ls.set("cal_hidden", [...S.hidden]); renderPD(); break;
    case "allon": S.hidden.clear(); ls.set("cal_hidden", []); renderPD(); break;
    case "alloff": S.works.forEach(w => S.hidden.add(w.token)); ls.set("cal_hidden", [...S.hidden]); renderPD(); break;
    case "comments": commentsModal(); break;
    case "cm-del": if (confirm("코멘트를 삭제할까요?")){ await store.deleteComment(t, id); commentsModal(); } break;
    case "a-send": authorSend(); break;
    case "mv-apply": { const r = document.querySelector('input[name="mv"]:checked'); applyMove(r ? r.value : "only"); break; }
  }
});
let DRAG = null;
document.addEventListener("dragstart", ev => {
  const el = ev.target.closest && ev.target.closest('.ev[draggable="true"]'); if (!el) return;
  DRAG = {t: el.dataset.t, id: el.dataset.id};
  ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", el.dataset.id);
  setTimeout(() => el.classList.add("dragging"), 0);
});
document.addEventListener("dragend", () => { DRAG = null; document.querySelectorAll(".dragging,.dropok").forEach(x => x.classList.remove("dragging","dropok")); });
document.addEventListener("dragover", ev => {
  if (!DRAG) return; const c = ev.target.closest && ev.target.closest(".cell"); if (!c) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = "move";
  document.querySelectorAll(".dropok").forEach(x => x !== c && x.classList.remove("dropok")); c.classList.add("dropok");
});
document.addEventListener("drop", ev => {
  if (!DRAG) return; const c = ev.target.closest && ev.target.closest(".cell"); if (!c) return;
  ev.preventDefault(); const d = DRAG; DRAG = null;
  document.querySelectorAll(".dragging,.dropok").forEach(x => x.classList.remove("dragging","dropok"));
  closeModal(); moveRequest(d.t, d.id, c.dataset.d);
});
document.addEventListener("change", ev => {
  if (ev.target.matches(".wdays input")) ev.target.parentElement.classList.toggle("on", ev.target.checked);
});
let RZ = null;
window.addEventListener("resize", () => { clearTimeout(RZ); RZ = setTimeout(() => { if (S.mode === "pd" && S.user) renderPD(); }, 250); });
document.addEventListener("input", ev => {
  if (ev.target.id === "side-q"){ S.q = ev.target.value; document.getElementById("side-list").innerHTML = sideListHTML(); }
});
document.addEventListener("toggle", ev => { if (ev.target.id === "side") S.sideOpen = ev.target.open; }, true);
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeModal();
  if (ev.key === "Enter" && ev.target.id === "f-newwork") addWork();
});

/* ===== 시작 ===== */
function startPD(){
  let unsubW = null;
  const begin = () => {
    unsubW = store.watchWorks(list => { S.works = list; syncCommentListeners(); renderPD(); }, e => toast("불러오지 못했습니다: " + e.message), S.user.email);
  };
  if (DEMO){ S.user = {email:"demo"}; begin(); return; }
  renderPD();
  store.auth.onAuthStateChanged(u => {
    if (u && !isPDEmail(u.email)){ S.denied = true; S.deniedEmail = u.email; store.auth.signOut(); return; }
    S.user = u;
    if (u && !unsubW) begin();
    renderPD();
  });
}
S.mode === "author" ? startAuthor() : startPD();
</script>
</body>
</html>
